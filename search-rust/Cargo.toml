[package]
name = "portfolio-search"
version = "0.1.0"
edition = "2021"
description = "In-browser full-text search engine for the portfolio"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
