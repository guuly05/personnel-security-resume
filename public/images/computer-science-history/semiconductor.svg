<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">From the transistor to the microprocessor</title><desc id="desc">A simplified illustration shows a discrete transistor leading to an integrated circuit and then a microprocessor containing many linked switching elements.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1820"/><stop offset="1" stop-color="#16313a"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#a5d0cb" stroke-opacity=".07"/></pattern></defs>
  <rect width="1200" height="610" rx="20" fill="url(#bg)"/><rect width="1200" height="610" rx="20" fill="url(#grid)"/>
  <text x="72" y="74" fill="#7fd2c4" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">SMALLER SWITCHES · LARGER SYSTEMS</text><text x="72" y="126" fill="#f3f1ed" font-family="Georgia,serif" font-size="38">The transistor changed what could fit in a computer</text>
  <g stroke="#79cec0" stroke-width="3" fill="none">
    <path d="M200 250v95m-65-95 65 43m65-43-65 43m-65 52 65-52 65 52"/><path d="M436 299h94m-12-12 12 12-12 12"/><path d="M704 299h94m-12-12 12 12-12 12"/>
  </g>
  <g fill="#122a35" stroke="#73909a" stroke-width="2"><rect x="114" y="214" width="172" height="172" rx="16"/><rect x="532" y="214" width="172" height="172" rx="16"/><rect x="800" y="200" width="274" height="200" rx="16"/></g>
  <g fill="#e8f0ed" font-family="Arial,sans-serif" text-anchor="middle"><text x="200" y="438" font-size="22" font-weight="700">One transistor</text><text x="200" y="465" font-size="15" fill="#afc2c4">an electronic switch</text><text x="618" y="438" font-size="22" font-weight="700">Integrated circuit</text><text x="618" y="465" font-size="15" fill="#afc2c4">many devices together</text><text x="937" y="438" font-size="22" font-weight="700">Microprocessor</text><text x="937" y="465" font-size="15" fill="#afc2c4">a CPU on a chip</text></g>
  <g fill="#64c7ba" stroke="#b8eee3" stroke-width="1"><circle cx="850" cy="245" r="7"/><circle cx="881" cy="245" r="7"/><circle cx="912" cy="245" r="7"/><circle cx="943" cy="245" r="7"/><circle cx="974" cy="245" r="7"/><circle cx="1005" cy="245" r="7"/><circle cx="850" cy="276" r="7"/><circle cx="881" cy="276" r="7"/><circle cx="912" cy="276" r="7"/><circle cx="943" cy="276" r="7"/><circle cx="974" cy="276" r="7"/><circle cx="1005" cy="276" r="7"/><circle cx="850" cy="307" r="7"/><circle cx="881" cy="307" r="7"/><circle cx="912" cy="307" r="7"/><circle cx="943" cy="307" r="7"/><circle cx="974" cy="307" r="7"/><circle cx="1005" cy="307" r="7"/><circle cx="850" cy="338" r="7"/><circle cx="881" cy="338" r="7"/><circle cx="912" cy="338" r="7"/><circle cx="943" cy="338" r="7"/><circle cx="974" cy="338" r="7"/><circle cx="1005" cy="338" r="7"/></g>
  <text x="72" y="550" fill="#91a9ac" font-family="Arial,sans-serif" font-size="16">The diagram is conceptual. Real chips contain dense, intricately wired structures, not a visible grid of round dots.</text>
</svg>
