<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">A conceptual drawing of Babbage's Analytical Engine</title><desc id="desc">An original schematic explains the planned store for numbers, mill for arithmetic, punched card input and output, and mechanical control.</desc>
  <defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f0e5cc"/><stop offset="1" stop-color="#d9c8a7"/></linearGradient><pattern id="lines" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5h24" stroke="#8a7958" stroke-opacity=".1"/></pattern></defs>
  <rect width="1200" height="650" rx="20" fill="url(#paper)"/><rect width="1200" height="650" rx="20" fill="url(#lines)"/>
  <text x="66" y="72" fill="#53645f" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">A MODERN INTERPRETATION OF THE DESIGN · NOT A PHOTOGRAPH</text>
  <text x="66" y="124" fill="#182b2e" font-family="Georgia,serif" font-size="38">Babbage imagined a machine with parts we still recognize</text>
  <g stroke="#52645e" stroke-width="3" fill="#e5d7bd">
    <rect x="90" y="230" width="260" height="190" rx="10"/><rect x="435" y="230" width="300" height="190" rx="10"/><rect x="820" y="230" width="275" height="190" rx="10"/>
    <rect x="114" y="252" width="212" height="22" rx="5"/><rect x="114" y="289" width="212" height="22" rx="5"/><rect x="114" y="326" width="212" height="22" rx="5"/><rect x="114" y="363" width="212" height="22" rx="5"/>
    <circle cx="520" cy="302" r="31"/><circle cx="650" cy="302" r="31"/><circle cx="585" cy="360" r="31"/><path d="M520 302h130M520 302l65 58m65-58-65 58" fill="none"/>
    <rect x="858" y="260" width="66" height="100" rx="3"/><path d="M874 265v90m17-90v90m17-90v90m-47-72h56m-56 22h56m-56 22h56"/>
    <path d="M350 325h76m309 0h76" fill="none" stroke="#9a7951" stroke-width="5"/>
    <path d="M404 315l16 10-16 10m347-20 16 10-16 10" fill="none" stroke="#9a7951" stroke-width="4"/>
  </g>
  <g fill="#172d2f" font-family="Arial,sans-serif" text-anchor="middle"><text x="220" y="464" font-size="24" font-weight="700">Store</text><text x="220" y="491" font-size="16">holds numbers</text><text x="585" y="464" font-size="24" font-weight="700">Mill</text><text x="585" y="491" font-size="16">does arithmetic</text><text x="958" y="464" font-size="24" font-weight="700">Punched cards</text><text x="958" y="491" font-size="16">instructions and data</text></g>
  <text x="66" y="578" fill="#566b68" font-family="Arial,sans-serif" font-size="17">Control flow, memory, and repeated operations were present in the plan; the full machine was never completed.</text>
</svg>
